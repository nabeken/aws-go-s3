name: Go

on:
  push:
    branches:
      - master
  pull_request:

env:
  # renovate: datasource=golang-version depName=golang
  GO_VERSION: '1.26.6'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '${{ env.GO_VERSION }}'
      id: go

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: go build -v ./...

    - name: Launch SeaweedFS
      run: |
        docker run -d --name seaweedfs -p 8333:8333 -e AWS_ACCESS_KEY_ID=aws-go-s3 -e AWS_SECRET_ACCESS_KEY=aws-go-s3 chrislusf/seaweedfs:4.50 mini -dir=/data
        # wait for the S3 gateway to be ready (it responds 403 to anonymous requests)
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)
          if [ "${code}" = "403" ]; then exit 0; fi
          sleep 1
        done
        docker logs seaweedfs
        exit 1

    - name: Test
      run: go test -v -cover ./...
      env:
        AWS_REGION: 'local'
